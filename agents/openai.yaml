interface:
  display_name: "Multi-Session Project Coordinator"
  short_description: "Evaluate worker count, bind/dispatch worker threads, and fall back from stalled worktrees."
  default_prompt: "Use $multi-session-project-coordinator after drafting the development plan to decide whether multi-session coordination is worthwhile, recommend worker count and role split, confirm with the user, then create or bind worker threads, verify cwd, dispatch scoped prompts, and supervise with pending worktree fallback if enabled."
policy:
  allow_implicit_invocation: true
