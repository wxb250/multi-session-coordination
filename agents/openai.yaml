interface:
  display_name: "Multi-Session Project Coordinator"
  short_description: "Evaluate worker count, coordinate sessions, and fall back from stalled pending worktrees."
  default_prompt: "Use $multi-session-project-coordinator after drafting the development plan to decide whether multi-session coordination is worthwhile, recommend the most efficient worker count and role split, ask for user confirmation, then supervise worker threads with pending worktree fallback if enabled."
policy:
  allow_implicit_invocation: true
